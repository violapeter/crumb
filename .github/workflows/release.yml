name: Release

# Releases are tag-driven. Pushing to master deliberately does NOT release --
# see ci.yml for what runs there. To cut a release, bump the version in
# package.json, merge it, then:
#
#   git tag v2.1.0 && git push origin v2.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Fails fast, before the expensive binary build, if the tag and
      # package.json disagree or if this version is already on npm.
      - name: Verify version
        id: version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_NAME="$(node -p 'require("./package.json").name')"
          PKG_VERSION="$(node -p 'require("./package.json").version')"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the package.json version ${PKG_VERSION}"
            exit 1
          fi

          if npm view "${PKG_NAME}@${TAG_VERSION}" version >/dev/null 2>&1; then
            echo "::error::${PKG_NAME}@${TAG_VERSION} is already published to npm"
            exit 1
          fi

          echo "VERSION=${TAG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build library
        run: npm run build

      - name: Build CLI
        run: npm run build:cli

      - name: Create binaries
        run: npm run package

      # Deliberately before the npm publish: creating the release is
      # re-runnable (this action updates an existing release in place),
      # whereas a published npm version can never be replaced. This order
      # keeps a failed run safe to retry.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            bin/crumbjs-linux-x64
            bin/crumbjs-linux-arm64
            bin/crumbjs-macos-x64
            bin/crumbjs-macos-arm64
            bin/crumbjs-win-x64.exe
            bin/crumbjs-win-arm64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
